<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Secure sign-in — Serqua</title>
    <style>
      :root { color-scheme: light; font-family: Manrope, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #080808; color: #fff; }
      main { width: min(520px, calc(100% - 32px)); padding: 36px; border: 1px solid #444; text-align: center; }
      h1 { margin: 0 0 12px; font: 600 36px/1 "Arial Narrow", Arial, sans-serif; text-transform: uppercase; }
      p { margin: 0; color: #bbb; font-size: 14px; line-height: 1.6; }
      a { display: inline-flex; margin-top: 24px; padding: 13px 18px; background: #fff; color: #111; font-size: 12px; font-weight: 800; text-decoration: none; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <h1>Completing secure sign-in.</h1>
      <p data-auth-status>Please wait while Shopify verifies your customer account.</p>
      <a href="/" data-auth-home hidden>Return to Serqua</a>
    </main>
    <script type="module" src="/customer-auth/callback/callback.js"></script>
  </body>
</html>
